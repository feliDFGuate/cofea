<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tu pedido · COFFEA</title><style>body{margin:0;background:#f5f3ed;color:#292d29;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:480px;padding:40px 25px;text-align:center}.brand{font:30px Georgia;letter-spacing:6px;color:#9d7c43}h1{font:38px Georgia}p{line-height:1.8;color:#777b70}a{display:inline-block;color:white;background:#292d29;padding:14px 26px;border-radius:5px;text-decoration:none}.state{padding:20px;background:white;border:1px solid #ddd;border-radius:10px;font-size:23px}</style></head><body><main><div class="brand">COFFEA</div><p>CAFÉS ESPECIALES · MODRA</p><h1>Tu pedido</h1><div class="state" id="status">Consultando…</div><p id="info"></p><p id="pay"></p><p>Conserva este enlace para consultar el estado de tu pedido.</p><a href="/">Volver a la carta</a></main><script>const states={received:'Recibido · pendiente de confirmar',accepted:'Confirmado por COFFEA',preparing:'Lo estamos preparando',ready:'Listo para entregar',delivered:'Entregado',cancelled:'Pedido cancelado'},pays={pending:'Pago al recibir · pendiente',paid:'Pago registrado',refund_pending:'Reembolso pendiente de gestión',refunded:'Reembolso registrado'};async function refresh(){try{const r=await fetch('/api/track?token='+encodeURIComponent(location.hash.slice(1)));const b=await r.json();if(!r.ok)throw Error(b.error);document.getElementById('status').textContent=states[b.status]||b.status;document.getElementById('info').textContent='#'+b.id.slice(0,8)+' · Total Q'+(b.total/100).toFixed(2);document.getElementById('pay').textContent=pays[b.payment_status]}catch(e){document.getElementById('status').textContent=e.message||'No se pudo consultar'}}refresh();setInterval(refresh,15000)</script></body></html>
