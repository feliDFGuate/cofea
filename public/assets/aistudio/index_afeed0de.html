<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COFFEA · Operación</title><style>
:root{--ink:#292d29;--gold:#9d7c43;--cream:#f5f3ed;--line:#dfdfd5;--muted:#777b70;--green:#346450}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;padding:10px 15px;border-radius:7px;color:var(--ink)}button:hover{border-color:var(--gold)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--ink);color:white;border-color:var(--ink)}.gold{background:#ede4d1;color:#795d30}.danger{color:#a03d36}a{color:inherit}.sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:var(--ink);color:#eeeade;padding:34px 20px;display:flex;flex-direction:column;z-index:3}.brand{font:30px Georgia;letter-spacing:5px;margin:0}.sub{font-size:9px;letter-spacing:3px;color:#cdb784;margin:10px 0 38px}.sidebar button{display:block;width:100%;text-align:left;border:0;background:none;color:#c5c8bd;margin:4px 0;padding:13px}.sidebar button.active{background:#454b40;color:#f0dbb1}.sidebar footer{margin-top:auto;color:#b3b8aa;font-size:12px;line-height:1.9}.main{margin-left:224px;padding:35px 38px;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--gold)}h1{font:36px Georgia;margin:10px 0 8px}h2{font:25px Georgia;margin:0 0 18px}h3{font-size:15px;margin:8px 0}p{line-height:1.7;color:var(--muted)}.top p{margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar input{max-width:330px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:27px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px}.stat small{color:var(--muted)}.stat strong{display:block;font:32px Georgia;margin:12px 0}.stat em{font-size:11px;font-style:normal;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:17px}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:22px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#f0eee6;font-size:11px}.received{background:#fff0cb;color:#815b17}.accepted,.preparing{background:#e1eaf0;color:#3d5a70}.ready,.paid,.delivered{background:#e4eee5;color:#376541}.cancelled,.low,.refund_pending{background:#f7e5df;color:#9d4832}.orderhead{display:flex;justify-content:space-between;align-items:center}.orderid{font:21px Georgia}.order .customer{margin:12px 0 4px;font-weight:600}.order .meta{font-size:12px;color:var(--muted);line-height:1.8}.order ul{padding-left:18px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}.actions button{font-size:12px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#eeeee7;color:#777b70}td,th{padding:15px 17px;border-bottom:1px solid #ecece6}td small{color:var(--muted)}label{display:block;font-size:12px;font-weight:600;margin:16px 0 7px}input,select,textarea{padding:11px;border:1px solid #d8dbd0;border-radius:6px;background:white;color:var(--ink);width:100%}textarea{min-height:70px}form .primary{margin-top:20px;width:100%}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}.note{background:#eee9dc;padding:14px 18px;border-left:3px solid var(--gold);font-size:12px;line-height:1.7;margin:15px 0;color:#70634c}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.hidden{display:none!important}.login{max-width:520px;margin:12vh auto;text-align:center}.login .brand{color:var(--gold)}.login a{display:inline-block;padding:13px 25px;margin:20px;background:var(--ink);color:white;text-decoration:none;border-radius:6px}dialog{border:0;border-radius:12px;padding:28px;width:min(540px,94vw);max-height:90vh;box-shadow:0 20px 100px #0004}dialog::backdrop{background:#1f271c88}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead h2{margin:0}.recipe-row{display:grid;grid-template-columns:1fr 100px 38px;gap:8px;margin:10px 0}.toast{position:fixed;bottom:25px;right:25px;background:var(--ink);color:white;padding:15px 24px;border-radius:8px;z-index:20;max-width:90vw;box-shadow:0 5px 30px #0003}.positem{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}.positem small{display:block;color:var(--muted)}.positem button{align-self:center}.cartline{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}.cartline button{padding:3px 9px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs .active{background:var(--ink);color:white}.statusbar{font-size:11px;color:var(--muted)}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{position:relative;width:100%;padding:20px}.sub{margin:7px 0 15px}.sidebar nav{display:flex;overflow:auto}.sidebar button{width:auto;white-space:nowrap}.sidebar footer{display:none}.main{margin:0;padding:24px 16px}.top{align-items:flex-start}.top h1{font-size:29px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:26px}.card{padding:18px}.top .primary{font-size:11px}}
</style></head><body>
<div id="login" class="login hidden"><p class="brand">COFFEA</p><p class="eyebrow">Panel de operación</p><h1>Tu cafetería, en orden.</h1><p>Acceso reservado para el equipo autorizado de COFFEA.</p><a href="/signin-with-chatgpt?return_to=%2Foperacion%2F" target="_top">Iniciar sesión</a><p id="loginmsg"></p><a href="/" style="background:none;color:#777">Volver a la carta</a></div>
<div id="app" class="hidden"><aside class="sidebar"><div class="brand">COFFEA</div><div class="sub">CAFÉS ESPECIALES</div><nav id="nav"></nav><footer><div id="who"></div><a href="/">Ver carta pública ↗</a><br><a target="_top" href="/signout-with-chatgpt?return_to=%2Foperacion%2F">Cerrar sesión</a></footer></aside><main class="main"><header class="top"><div><span class="eyebrow">Modra · Zona 4</span><h1 id="title">Operación</h1><p id="subtitle">Inventario, pedidos y equipo.</p></div><button onclick="refresh()">↻ Actualizar</button></header><div id="content"></div><p id="sync" class="statusbar"></p></main></div>
<dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button onclick="modal.close()" aria-label="Cerrar">✕</button></div><div id="modalBody"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=c=>'Q'+(c/100).toFixed(2),fmt=n=>Number(n).toLocaleString('es-GT',{maximumFractionDigits:3}),date=d=>new Date(d).toLocaleString('es-GT',{timeZone:'America/Guatemala',dateStyle:'short',timeStyle:'short'});
const states={received:'Recibido',accepted:'Confirmado',preparing:'En preparación',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'},pays={pending:'Pendiente de pago',paid:'Pagado',refund_pending:'Reembolso pendiente',refunded:'Reembolsado'};
let D=null,view='resumen',orderFilter='active',search='',basket={},requestKey=crypto.randomUUID(),busy=false;
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),5000)}
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const b=await r.json();if(!r.ok)throw Error(b.error||'No se pudo completar');return b;}
async function save(path,data){if(busy)return false;busy=true;document.querySelectorAll('dialog button[type=submit]').forEach(b=>b.disabled=true);try{await api(path,data);$('modal').close();await refresh();toast('Guardado correctamente');return true}catch(e){toast(e.message);return false}finally{busy=false;document.querySelectorAll('dialog button[type=submit]').forEach(b=>b.disabled=false)}}
async function refresh(){try{D=await api('dashboard');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=D.user.email+' · '+D.user.role;render();$('sync').textContent='Última actualización: '+new Date().toLocaleTimeString('es-GT')+' · Datos compartidos en línea';}catch(e){if(!D){$('login').classList.remove('hidden');$('loginmsg').textContent=e.message}else toast(e.message)}}
function go(v){view=v;search='';render()}
function render(){const nav=[['resumen','Vista general'],['pedidos','Pedidos'],['comandas','Comandas de cocina'],['caja','Nueva venta'],['inventario','Inventario'],['recetas','Productos y recetas'],['reportes','Ventas y reportes'],['puntos','Puntos y recompensas'],['equipo','Equipo y accesos']].filter(([k])=>D.user.role==='admin'||(D.user.role==='cocina'?['resumen','pedidos','comandas'].includes(k):['resumen','pedidos','comandas','caja','reportes'].includes(k)));if(!nav.some(([k])=>k===view))view='resumen';$('nav').innerHTML=nav.map(([k,t])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');$('title').textContent=nav.find(([k])=>k===view)[1];$('subtitle').textContent=({resumen:'Un vistazo a tu cafetería.',comandas:'Pedidos confirmados de caja y de la web.',pedidos:'De la primera orden a la última entrega.',caja:'Pedidos de mostrador, mesa y apartamento.',inventario:'Cada entrada, salida y merma, registrada.',recetas:'Precios, disponibilidad e ingredientes por preparación.',reportes:'Ventas registradas y cobros pendientes.',puntos:'Premia a quienes vuelven por un buen café.',equipo:'Cada persona, con el acceso que necesita.'})[view];window['render_'+view]()}
function today(o){return new Date(o.created).toLocaleDateString('en-CA',{timeZone:'America/Guatemala'})===new Date().toLocaleDateString('en-CA',{timeZone:'America/Guatemala'})}
function stats(){const orders=D.orders.filter(today),paid=orders.filter(o=>o.payment_status==='paid'&&o.status!=='cancelled'),active=D.orders.filter(o=>!['delivered','cancelled'].includes(o.status)),low=D.stock.filter(s=>s.qty<=s.minimum);return `<div class="stats"><div class="stat"><small>Ventas cobradas hoy</small><strong>${money(paid.reduce((s,o)=>s+o.total,0))}</strong><em>${paid.length} pedidos cobrados</em></div><div class="stat"><small>Pedidos activos</small><strong>${active.length}</strong><em>${active.filter(o=>o.status==='received').length} por confirmar</em></div><div class="stat"><small>Listos para entregar</small><strong>${active.filter(o=>o.status==='ready').length}</strong><em>En cafetería o al apartamento</em></div><div class="stat"><small>Alertas de inventario</small><strong>${low.length}</strong><em>${D.stock.length} insumos registrados</em></div></div>`}
function render_resumen(){$('content').innerHTML=stats()+`<div class="split"><section class="card"><h2>En la barra</h2>${D.orders.filter(o=>!['cancelled','delivered'].includes(o.status)).slice(0,6).map(o=>`<div class="positem"><div><b>#${o.id.slice(0,8)} · ${esc(o.name)}</b><small>${o.delivery==='puerta'?'Apto. '+esc(o.apartment):'Retiro en cafetería'} · ${date(o.created)}</small></div><span class="pill ${o.status}">${states[o.status]}</span></div>`).join('')||'<div class="empty">No hay pedidos pendientes.</div>'}<button onclick="go('pedidos')" style="margin-top:18px">Ver pedidos →</button></section><section class="card"><h2>Existencias por revisar</h2>${D.stock.filter(s=>s.qty<=s.minimum).slice(0,7).map(s=>`<div class="positem"><b>${esc(s.name)}</b><span class="pill low">${fmt(s.qty)} ${s.unit}</span></div>`).join('')||'<p>No hay alertas. Las cantidades aparecen al cargar el inventario inicial.</p>'}<div class="note">${D.products.filter(p=>p.mode==='untracked').length} productos aún sin control de existencias. Configura sus unidades o recetas antes de operar con inventario.</div></section></div>`}
function orderCard(o){const ls=D.lines.filter(l=>l.order_id===o.id),next={received:['accepted','Confirmar pedido'],accepted:['preparing','Preparar'],preparing:['ready','Marcar listo'],ready:['delivered','Entregar']}[o.status];const allowed=next&&(D.user.role!=='cocina'||['preparing','ready'].includes(next[0]));return `<article class="card order"><div class="orderhead"><span class="orderid">#${o.id.slice(0,8)}</span><span class="pill ${o.status}">${states[o.status]}</span></div><div class="customer">${esc(o.name)}</div><div class="meta">${o.delivery==='puerta'?'Apartamento '+esc(o.apartment):'Retiro en cafetería'} · ${esc(o.source)}<br>${esc(o.phone)} · ${date(o.created)}</div><ul>${ls.map(l=>`<li>${l.qty} × ${esc(l.name)}</li>`).join('')}</ul>${o.notes?`<div class="note">${esc(o.notes)}</div>`:''}<div class="orderhead"><b>${money(o.total)}</b><span class="pill ${o.payment_status}">${pays[o.payment_status]}</span></div>${D.user.role!=='cocina'&&o.payment_status==='refund_pending'?`<button style="margin-top:15px" onclick="refund('${o.id}')">Registrar devolución realizada</button>`:''}${o.cancel_reason?`<p>${esc(o.cancel_reason)}</p>`:''}<div class="actions">${allowed?`<button class="primary" onclick="statusOrder('${o.id}','${next[0]}')">${next[1]}</button>`:''}${D.user.role!=='cocina'&&o.payment_status==='pending'&&o.status!=='cancelled'?`<button onclick="payment('${o.id}')">Registrar cobro</button>`:''}${D.user.role!=='cocina'&&!['delivered','cancelled'].includes(o.status)?`<button class="danger" onclick="cancelOrder('${o.id}')">Cancelar</button>`:''}</div></article>`}
function render_comandas() {
 const columns = [['accepted','Por preparar'],['preparing','En preparación'],['ready','Listos']];
 $('content').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;margin-top:24px">' +
 columns.map(([status,title]) => {
   const orders = D.orders.filter(order => order.status === status).sort((a,b) => a.created.localeCompare(b.created));
   return `<section><h2>${title} · ${orders.length}</h2>${orders.map(order => {
     const lines = D.lines.filter(line => line.order_id === order.id);
     const next = status === 'accepted' ? ['preparing','Iniciar preparación'] : ['ready','Marcar listo'];
     return `<article class="card order"><div class="orderhead"><strong>#${order.id.slice(0,8)}</strong><span>${date(order.created)}</span></div>
       <p>${order.delivery==='puerta'?'Apartamento '+esc(order.apartment):'Retiro en cafetería'} · ${esc(order.source)}</p>
       <ul>${lines.map(line=>`<li>${line.qty} × ${esc(line.name)}</li>`).join('')}</ul>
       ${order.notes?`<div class="note">${esc(order.notes)}</div>`:''}
       ${status!=='ready'?`<button class="primary" onclick="statusOrder('${order.id}','${next[0]}')">${next[1]}</button>`:''}</article>`;
   }).join('') || '<p>Sin comandas</p>'}</section>`;
 }).join('') + '</div>';
}
function render_pedidos(){let orders=D.orders.filter(o=>orderFilter==='all'||(orderFilter==='active'?!['cancelled','delivered'].includes(o.status):o.status===orderFilter));if(search)orders=orders.filter(o=>(o.id+' '+o.name+' '+o.apartment).toLowerCase().includes(search.toLowerCase()));$('content').innerHTML=`<div class="toolbar"><div class="tabs">${[['active','Activos'],['received','Recibidos'],['preparing','Preparación'],['ready','Listos'],['all','Todos']].map(([k,t])=>`<button class="${orderFilter===k?'active':''}" onclick="orderFilter='${k}';render_pedidos()">${t}</button>`).join('')}</div><input placeholder="Buscar pedido, cliente o apartamento" value="${esc(search)}" oninput="search=this.value;renderOrderResults()"></div><div id="orderResults" class="grid">${orders.map(orderCard).join('')||'<div class="empty">No hay pedidos en esta vista.</div>'}</div>`}
function renderOrderResults(){const s=search.toLowerCase();$('orderResults').innerHTML=D.orders.filter(o=>(orderFilter==='all'||(orderFilter==='active'?!['cancelled','delivered'].includes(o.status):o.status===orderFilter))&&(o.id+' '+o.name+' '+o.apartment).toLowerCase().includes(s)).map(orderCard).join('')}
async function statusOrder(id,status){await save('status',{id,status})}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}
function payment(id){openModal('Registrar pago recibido',`<p>Registra un cobro realizado en caja o por un medio externo. Esta acción no procesa tarjetas.</p><form onsubmit="event.preventDefault();save('payment',{id:'${id}',method:this.elements.namedItem('method').value,reference:this.elements.namedItem('reference').value})"><label>Forma de pago</label><select name="method"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta · terminal externa</option><option value="transferencia">Transferencia confirmada</option></select><label>Referencia / comprobante</label><input name="reference" maxlength="100"><button class="primary" type="submit">Confirmar pago recibido</button></form>`)}
function refund(id){openModal('Registrar reembolso',`<p>Confirma únicamente después de devolver el dinero por el medio original. El sistema registra la devolución; no transfiere fondos.</p><form onsubmit="event.preventDefault();save('refund',{id:'${id}',reference:this.elements.namedItem('reference').value})"><label>Comprobante o referencia</label><input name="reference" required maxlength="100"><button class="primary" type="submit">Registrar reembolso realizado</button></form>`)}
function cancelOrder(id){const o=D.orders.find(o=>o.id===id);openModal('Cancelar pedido',`<form onsubmit="event.preventDefault();save('status',{id:'${id}',status:'cancelled',reason:this.elements.namedItem('reason').value,restore:this.elements.namedItem('restore')?.checked||false})"><label>Motivo</label><textarea name="reason" required maxlength="200"></textarea>${['preparing','ready'].includes(o.status)?'<label><input type="checkbox" name="restore" style="width:auto"> Devolver insumos al inventario</label><p>Marca esta opción únicamente si los insumos se recuperaron. Si ya fueron utilizados, se conserva la salida.</p>':'<p>Si el pedido estaba confirmado, sus existencias se devolverán automáticamente.</p>'}${o.payment_status==='paid'?'<div class="note">El cobro quedará como reembolso pendiente. La devolución del dinero se gestiona por el medio original.</div>':''}<button class="primary" type="submit">Confirmar cancelación</button></form>`)}
function render_inventario(){$('content').innerHTML=`<div class="toolbar"><button class="primary" onclick="editStock()">+ Nuevo insumo</button><button onclick="movement()">Registrar entrada / salida</button><button onclick="exportCSV('stock')">Exportar inventario</button></div><div class="tablewrap"><table><thead><tr><th>Insumo / producto</th><th>Existencia</th><th>Mínimo</th><th>Costo por unidad</th><th>Estado</th><th></th></tr></thead><tbody>${D.stock.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${fmt(s.qty)} ${s.unit}</td><td>${fmt(s.minimum)} ${s.unit}</td><td>${money(s.cost)}</td><td><span class="pill ${s.qty<=s.minimum?'low':'paid'}">${s.qty<=s.minimum?'Reponer':'Disponible'}</span></td><td><button onclick="editStock('${s.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Carga insumos y registra las cantidades iniciales.</td></tr>'}</tbody></table></div><h2 style="margin-top:30px">Últimos movimientos</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Insumo</th><th>Cantidad</th><th>Motivo</th><th>Referencia</th><th>Usuario</th></tr></thead><tbody>${D.movements.map(m=>`<tr><td>${date(m.created)}</td><td>${esc(D.stock.find(s=>s.id===m.stock_id)?.name||m.stock_id)}</td><td>${m.delta>0?'+':''}${fmt(m.delta)}</td><td>${esc(m.reason)}</td><td>${esc(m.reference).slice(0,40)}</td><td>${esc(m.actor)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sin movimientos registrados.</td></tr>'}</tbody></table></div>`}
function editStock(id){const s=D.stock.find(s=>s.id===id)||{id:'',name:'',unit:'unidad',minimum:0,cost:0};openModal(id?'Editar insumo':'Nuevo insumo',`<form onsubmit="event.preventDefault();save('stock',{id:'${s.id}',name:this.elements.namedItem('nombre').value,unit:this.elements.namedItem('unit').value,minimum:this.elements.namedItem('minimum').value,cost:this.elements.namedItem('cost').value})"><label>Nombre</label><input name="nombre" required value="${esc(s.name)}"><div class="row"><div><label>Unidad base</label><select name="unit">${['unidad','g','ml'].map(u=>`<option ${s.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Existencia mínima</label><input name="minimum" type="number" step="any" min="0" required value="${s.minimum}"></div></div><label>Costo por unidad base (Q)</label><input name="cost" type="number" step=".01" min="0" required value="${s.cost/100}"><p>Para café usa gramos; para leche usa mililitros. Registra las cantidades desde entradas y salidas.</p><button class="primary" type="submit">Guardar insumo</button></form>`)}
function movement(){openModal('Entrada, salida o merma',`<form onsubmit="event.preventDefault();save('movement',{id:this.elements.namedItem('item').value,delta:Number(this.elements.namedItem('qty').value)*Number(this.elements.namedItem('direction').value),reason:this.elements.namedItem('reason').value,reference:this.elements.namedItem('reference').value})"><label>Insumo</label><select name="item" required>${D.stock.map(s=>`<option value="${s.id}">${esc(s.name)} · ${fmt(s.qty)} ${s.unit}</option>`).join('')}</select><div class="row"><div><label>Movimiento</label><select name="direction"><option value="1">Entrada (+)</option><option value="-1">Salida / merma (−)</option></select></div><div><label>Cantidad en unidad base</label><input name="qty" type="number" step="any" min="0.001" required></div></div><label>Motivo</label><select name="reason"><option>Inventario inicial</option><option>Compra a proveedor</option><option>Merma / vencimiento</option><option>Ajuste por conteo físico</option><option>Consumo interno</option></select><label>Proveedor / factura / referencia</label><input name="reference" maxlength="120"><button class="primary" type="submit">Registrar movimiento</button></form>`)}
function render_recetas(){$('content').innerHTML=`<div class="note">El precio de venta y la disponibilidad se reflejan en la carta. Los productos sin control no descuentan existencias. Las recetas se expresan en la unidad base de cada insumo.</div><div class="toolbar"><input placeholder="Buscar producto" oninput="productResults(this.value)"></div><div id="productsTable"></div>`;productResults('')}
function productResults(s){$('productsTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Precio</th><th>Control</th><th>Disponible</th><th></th></tr></thead><tbody>${D.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(s.toLowerCase())).map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.category)}</small></td><td>${p.price===null?'Por confirmar':money(p.price)}</td><td>${({untracked:'Sin configurar',direct:'Por unidades',recipe:'Por receta'})[p.mode]}</td><td>${p.active?'Sí':'No'}</td><td><button onclick="editProduct('${p.id}')">Configurar</button> <button onclick="recipe('${p.id}')">Receta</button></td></tr>`).join('')}</tbody></table></div>`}
function editProduct(id){const p=D.products.find(p=>p.id===id);openModal(p.name,`<form onsubmit="event.preventDefault();save('product',{id:'${id}',price:this.elements.namedItem('price').value,mode:this.elements.namedItem('mode').value,active:this.elements.namedItem('active').checked})"><label>Precio de venta (Q)</label><input name="price" type="number" min="0" step=".01" value="${p.price===null?'':p.price/100}" placeholder="Vacío = por confirmar"><label>Control de inventario</label><select name="mode">${[['untracked','Sin configurar'],['direct','Por unidades (bolsas, botellas, piezas)'],['recipe','Por receta (café, leche, ingredientes)']].map(([v,t])=>`<option value="${v}" ${p.mode===v?'selected':''}>${t}</option>`).join('')}</select><label><input name="active" type="checkbox" style="width:auto" ${p.active?'checked':''}> Disponible para vender</label><p>Al elegir unidades se crea un insumo con existencia cero. Carga sus unidades antes de confirmar ventas.</p><button class="primary" type="submit">Guardar producto</button></form>`)}
function recipe(id){const p=D.products.find(p=>p.id===id);openModal('Receta · '+p.name,`<p>Cantidad utilizada en una unidad del producto.</p><form id="recipeForm" onsubmit="event.preventDefault();saveRecipe('${id}')"><div id="recipeRows"></div><button type="button" onclick="recipeRow()">+ Ingrediente</button><button class="primary" type="submit">Guardar receta y activar control</button></form>`);const rs=D.recipes.filter(r=>r.product_id===id);if(rs.length)rs.forEach(r=>recipeRow(r.stock_id,r.qty));else recipeRow()}
function recipeRow(id='',qty=''){const row=document.createElement('div');row.className='recipe-row';row.innerHTML=`<select required>${D.stock.map(s=>`<option value="${s.id}" ${id===s.id?'selected':''}>${esc(s.name)} (${s.unit})</option>`).join('')}</select><input aria-label="Cantidad" type="number" required min=".001" step="any" value="${qty}" placeholder="Cantidad"><button type="button" onclick="this.parentElement.remove()">×</button>`;$('recipeRows').append(row)}
function saveRecipe(id){const items=[...document.querySelectorAll('.recipe-row')].map(r=>({id:r.querySelector('select').value,qty:Number(r.querySelector('input').value)}));save('recipe',{id,items})}
function render_caja(){$('content').innerHTML=`<div class="split" style="margin-top:25px"><section class="card"><h2>Carta de COFFEA</h2><input placeholder="Buscar café, comida…" oninput="posResults(this.value)"><div id="posProducts"></div></section><section class="card"><h2>Nueva venta</h2><div id="posBasket"></div><form onsubmit="event.preventDefault();posSubmit(this)"><label>Nombre del cliente / mesa</label><input name="nombre" value="Mostrador" required><label>Teléfono / identificador del cliente</label><input name="phone" value="Mostrador" required><label>Entrega</label><select name="delivery"><option value="retiro">Retiro / mesa</option><option value="puerta">Apartamento</option></select><label>Apartamento (si aplica)</label><input name="apartment"><label>Notas</label><textarea name="notes"></textarea><button class="primary" type="submit">Crear pedido</button></form><p>El cobro se registra desde el pedido. No se realiza ningún cargo automático.</p></section></div>`;posResults('');posBasket()}
function posResults(s){$('posProducts').innerHTML=D.products.filter(p=>p.active&&p.price!==null&&p.name.toLowerCase().includes(s.toLowerCase())).slice(0,35).map(p=>`<div class="positem"><div><b>${esc(p.name)}</b><small>${esc(p.category)} · ${money(p.price)}</small></div><button onclick="basket['${p.id}']=(basket['${p.id}']||0)+1;posBasket()">+</button></div>`).join('')}
function posBasket(){let total=0,emp=0;$('posBasket').innerHTML=Object.entries(basket).filter(([id,n])=>n>0).map(([id,n])=>{const p=D.products.find(p=>p.id===id);total+=p.price*n;if(p.category==='Empanadas')emp+=n;return `<div class="cartline"><span>${n} × ${esc(p.name)}</span><button onclick="basket['${id}']--;posBasket()">−</button></div>`}).join('')+`<h3>Total: ${money(total-Math.floor(emp/3)*500)}</h3>`}
async function posSubmit(f){if(busy)return;busy=true;const btn=f.querySelector('button[type=submit]');btn.disabled=true;try{const b=await api('orders',{key:requestKey,source:'caja',items:Object.entries(basket).filter(([id,qty])=>qty>0).map(([id,qty])=>({id,qty})),name:f.nombre.value,phone:f.phone.value,delivery:f.delivery.value,apartment:f.apartment.value,notes:f.notes.value});basket={};requestKey=crypto.randomUUID();view='pedidos';await refresh();toast('Pedido creado #'+b.id.slice(0,8))}catch(e){toast(e.message)}finally{busy=false;btn.disabled=false}}
function render_reportes(){const paid=D.orders.filter(o=>o.payment_status==='paid'&&o.status!=='cancelled'),sales=paid.reduce((s,o)=>s+o.total,0),pending=D.orders.filter(o=>o.payment_status==='pending'&&o.status!=='cancelled');const top={};D.lines.filter(l=>paid.some(o=>o.id===l.order_id)).forEach(l=>{top[l.name]=(top[l.name]||0)+l.qty});$('content').innerHTML=stats()+`<div class="toolbar"><button onclick="exportCSV('orders')">Exportar pedidos CSV</button></div><div class="note">Se muestran los últimos 300 pedidos. Ventas y cobros se calculan con sus precios guardados. Las horas corresponden a Guatemala.</div><div class="split"><section class="card"><h2>Ventas registradas</h2><h1>${money(sales)}</h1><p>${paid.length} pedidos cobrados · ticket promedio ${money(paid.length?sales/paid.length:0)}</p><h3>Pendiente de cobro: ${money(pending.reduce((s,o)=>s+o.total,0))}</h3><p>Reembolsos pendientes: ${D.orders.filter(o=>o.payment_status==='refund_pending').length}</p>${['efectivo','tarjeta','transferencia'].map(m=>`<div class="positem"><span>${m}</span><b>${money(paid.filter(o=>o.payment_method===m).reduce((s,o)=>s+o.total,0))}</b></div>`).join('')}</section><section class="card"><h2>Productos más vendidos</h2>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,q])=>`<div class="positem"><span>${esc(n)}</span><b>${q}</b></div>`).join('')||'<p>Las ventas cobradas aparecerán aquí.</p>'}</section></div>`}
function exportCSV(type){const rows=type==='stock'?D.stock.map(s=>({nombre:s.name,unidad:s.unit,existencia:s.qty,minimo:s.minimum,costo_Q:s.cost/100})):D.orders.map(o=>({pedido:o.id,fecha:o.created,cliente:o.name,estado:states[o.status],cobro:pays[o.payment_status],medio:o.payment_method,total_Q:o.total/100}));if(!rows.length)return toast('No hay datos para exportar');const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const csv='\ufeff'+[Object.keys(rows[0]).map(cell).join(','),...rows.map(r=>Object.values(r).map(cell).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='coffea-'+type+'.csv';a.click();URL.revokeObjectURL(a.href)}
function render_puntos(){const rate=D.settings.find(s=>s.key==='earn_every')?.value||0;$('content').innerHTML=`<div class="split" style="margin-top:25px"><section class="card"><h2>Reglas de acumulación</h2><p>Los puntos se acreditan una sola vez cuando un pedido está pagado y entregado. El teléfono identifica al cliente.</p><form onsubmit="event.preventDefault();save('settings',{earnEvery:this.elements.namedItem('rate').value})"><label>Quetzales de compra por cada punto</label><input type="number" step=".01" min="0" name="rate" value="${rate}" required><p>0 mantiene la acumulación desactivada hasta definir la promoción.</p><button class="primary" type="submit">Guardar regla</button></form></section><section class="card"><h2>Canje o ajuste</h2><form onsubmit="event.preventDefault();save('points',{phone:this.elements.namedItem('phone').value,amount:Number(this.elements.namedItem('amount').value),reason:this.elements.namedItem('reason').value})"><label>Teléfono del cliente</label><input name="phone" required><label>Puntos (+ acreditar / − canjear)</label><input type="number" name="amount" step="1" required><label>Premio o motivo</label><input name="reason" required><button type="submit" class="primary">Registrar movimiento</button></form></section></div><h2 style="margin-top:28px">Saldos de clientes</h2><div class="tablewrap"><table><thead><tr><th>Cliente / teléfono</th><th>Puntos</th></tr></thead><tbody>${D.points.map(p=>`<tr><td>${esc(p.phone)}</td><td>${p.balance}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Aún no hay puntos registrados.</td></tr>'}</tbody></table></div>`}
function render_equipo(){$('content').innerHTML=`<div class="split" style="margin-top:25px"><section class="card"><h2>Autorizar una cuenta</h2><form onsubmit="event.preventDefault();save('staff',{email:this.elements.namedItem('email').value,role:this.elements.namedItem('role').value,active:true})"><label>Correo de su cuenta</label><input type="email" name="email" required><label>Rol</label><select name="role"><option value="caja">Caja · pedidos y cobros</option><option value="cocina">Cocina · preparación y listos</option><option value="admin">Administración · acceso completo</option></select><button class="primary" type="submit">Guardar acceso</button></form><p>La persona inicia sesión con la cuenta autorizada desde este panel. No se envía una invitación automática.</p></section><section class="card"><h2>Equipo autorizado</h2><div class="positem"><div><b>Propietario</b><small>Acceso de administración protegido</small></div></div>${D.staff.map(s=>`<div class="positem"><div><b>${esc(s.email)}</b><small>${s.role} · ${s.active?'Activo':'Desactivado'}</small></div><button onclick='toggleStaff(${JSON.stringify(s).replace(/'/g,'&#39;')})'>${s.active?'Desactivar':'Activar'}</button></div>`).join('')}</section></div>`}
function toggleStaff(s){save('staff',{email:s.email,role:s.role,active:!s.active})}
refresh();setInterval(()=>{if(D&&!busy&&!$('modal').open&&view!=='caja')refresh()},20000);
</script></body></html>
